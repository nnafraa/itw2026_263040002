<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba elemet form</title>
</head>
<body>
    <h1>Contoh elemen-elemen form pada HTML</h1>

    <form>
        <label for="nama">nama:
           <input type="text name="nama" id="nama" placeholder="masukkan nama">
        </label>

        <br>
        <label for="password">password:
            <input type="password" name="password" id="password">
        </label>

        <br>
        <label for="email">email:
            <input type="email" name="email" id="email">
        </label>

        <br>
        <label for="angka">angka:
            <input type="number" name="angka" id="angka" min="0" max="100" step="5">
        </label>

        <br>
        <label for="tanggal">tanggal:
            <input type="date" name="tanggal" id="tanggal">
        </label>

        <br>
        <label for="warna"> pilih warna:
            <input type="color" name="warna" id="warna">
        </label>

        <br>
        <button type="submit">kirim!</button>


    </form>
    
</body>
</html>
