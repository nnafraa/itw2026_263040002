<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba input atribut, checkbox & radio </title>
</head>
<body>

    <h1>Contoh input atribut, checkbox & radio</h1>

    <form>

        <label for="name">Nama:
            <input type="text" name="name" id="name" placeholder="masukkan nama" autocomplete="off" autofocus required>
        </label>

        <br>
        <h3>Hobby:</h3>
        <label for="hobby1">
            <input type="checkbox" name="hobby1" id="hobby1" value="Olahraga" checked>
            Olahraga
        </label>

        <label for="hobby2">
            <input type="checkbox" name="hobby2" id="hobby2" value="Ngoding">
            Ngoding
        </label>

        <br>
        <h3>Jenis Kelamin:</h3>
        <label for="laki-laki">
            <input type="radio" name="Jenis kelamin" id="laki-laki" value="Pria" checked>
            Pria
        </label>

        <br>
        <label for="Wanita">
            <input type="radio" name="Jenis kelamin" id="Wanita" value="Wanita">
            Wanita
        </label>
        <br>
        <button type="submit">Kirim</button>



    </form>

    
</body>
</html>
