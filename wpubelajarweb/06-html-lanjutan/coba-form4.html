<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba elemen form didalam tabel</title>
</head>
<body>
    <h1>Contoh elemen-elemen form pada HTML</h1>

    <table cellpadding="4">
<form>
        <tr>
            <td align="right">
                <label for="nama">nama:</label>
            </td>
            <td>
                <input type="text" name="nama" id="nama" placeholder="masukkan nama">
            </td>
        </tr>
        <tr>
            <td align="right">
                <label for="password">password:</label>
            </td>
            <td>
                <input type="password" name="password" id="password">
            </td>
        </tr>
        <tr>
            <td align="right">
                <label for="email">email:</label>
            </td>
            <td>
                <input type="email" name="email" id="email">
            </td>
        </tr>
        <tr>
            <td align="right">
                <label for="angka">angka:</label>
            </td>
            <td>
                <input type="number" name="angka" id="angka" min="0" max="100" step="5">
            </td>
        </tr>
        <tr>
            <td align="right">
                <label for="tanggal">tanggal:</label>
            </td>
            <td>
                <input type="date" name="tanggal" id="tanggal">
            </td>
        </tr>
        <tr>
            <td align="right">
                <label for="warna">pilih warna:</label>
            </td>
            <td>
                <input type="color" name="warna" id="warna">
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <button type="submit">kirim!</button>

            </td>
            
        </tr>
    </table>
</form>    
</body>
</html>
