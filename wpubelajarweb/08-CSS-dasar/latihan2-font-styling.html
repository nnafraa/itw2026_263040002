<!DOCTYPE html>  
<html lang="id">
<head>  
  <meta charset="UTF-8">  
  <title>Alkateri Zaman</title>  
  <style>  
    body {  
      font-family: 'Courier New', Courier, monospace;  
      font-weight: bold;  
      color: rgb(61, 61, 61);  
      text-align: center;  
    }
    
    h1 {  
      font-size: 48px;  
      text-transform: uppercase;  
      font-style: italic;  
      letter-spacing: 10px;  
      text-decoration: underline;  
      text-decoration-style: wavy;  
      text-decoration-color: rgb(100, 100, 100);  
      text-shadow: 5px 5px 0 rgb(215, 215, 215);  
    }

    .quote {  
      font-size: 22px;  
      line-height: 2.2;  
      word-spacing: 5px;  
    }

    span {  
      color: rgb(181, 181, 181);  
      text-decoration: line-through;  
    }

    .credit {  
      font-size: 12px;  
      letter-spacing: 2px;  
      color: rgb(151, 151, 151);  
      font-weight: normal;  
    }  
  </style>  
</head>
<body>
  <h1>rasa sesal</h1>
  <p class="quote">  
    "Semua layu dan takkan pernah <span>berarti</span>. <br>  
    Tiba waktunya semua akan terjadi. <br>  
    Jadi katalis tak bisa hindari lagi, <br>  
    Temui kekal dengan rasa sesal."  
  </p>
  <p class="credit">— zaman alkateri</p>
</body>
</html>
