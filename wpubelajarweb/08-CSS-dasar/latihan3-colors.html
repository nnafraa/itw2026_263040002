<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <title>Zaman Alkateri</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #f8f8ff;
      text-align: center;
      background-color: #0F172A;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #374460;
      text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      color: #38BAF4;
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: crimson;
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151 151 151 / 70%);
      font-weight: normal;
    }
  </style></head><body>

  <h1>rasa sesal</h1>

  <p class="quote">
    "Semua layu dan takkan pernah <span>berarti</span>. <br>
    Tiba waktunya semua akan terjadi. <br>
    Jadi katalis tak bisa hindari lagi, <br>
    Temui kekal dengan rasa sesal."
  </p>

  <p class="credit">— zaman alkateri</p></body></html>
